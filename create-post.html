<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06040a">
  <title>ARS — Create Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="create-post.css">
</head>
<body>
  <div class="glow-bg"></div>

  <main class="composer">
    <!-- Top Header Navigation -->
    <header class="composer-head">
      <a href="home.html" class="close-btn" aria-label="Cancel">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </a>
      <h1 id="pageTitle" class="composer-title">Create Post</h1>
      <button id="publish" class="publish-btn" type="button">
        <span>Publish</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </header>

    <div class="composer-body">
      <!-- Identity Section -->
      <section class="identity-card">
        <div class="identity-left">
          <div id="avatar" class="avatar-ring">A</div>
          <div class="user-meta">
            <div class="name-row">
              <b id="displayName">Your ARS account</b>
              <span class="ars-badge" title="Verified Creator">◆</span>
            </div>
            <small id="handle">@you</small>
          </div>
        </div>
        <div class="audience-badge" id="audienceQuickBadge">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span id="badgePrivacyText">Public</span>
        </div>
      </section>

      <!-- Post Content Input Area -->
      <div class="content-box">
        <textarea id="content" maxlength="5000" placeholder="What's on your mind?" rows="4" autofocus></textarea>
        <div class="counter-row">
          <div class="formatting-pills">
            <button type="button" class="format-btn" data-insert="bold" title="Bold"><b>B</b></button>
            <button type="button" class="format-btn" data-insert="italic" title="Italic"><i>I</i></button>
            <button type="button" class="format-btn" data-insert="hashtag" title="Hashtag">#</button>
            <button type="button" class="format-btn" data-insert="mention" title="Mention">@</button>
            <button type="button" class="format-btn" data-insert="location" title="Add location">⌖</button>
            <button type="button" class="format-btn highlight" id="editMedia" title="Story Media Editor">✧</button>
          </div>
          <div class="char-counter">
            <span id="charCount">0</span><span class="max-chars">/280</span>
          </div>
        </div>
      </div>

      <!-- Media Upload Zone -->
      <div class="media-section">
        <div class="media-grid" id="mediaGrid">
          <label class="add-media-card" for="media">
            <div class="add-icon-circle">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
            </div>
            <b>Add photo or video</b>
            <span>Supports high quality media</span>
            <input id="media" type="file" accept="image/*,video/*" multiple>
          </label>
        </div>
      </div>

      <!-- Detail Fields (Location & Tags) -->
      <div class="extra-fields">
        <div class="input-card">
          <div class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </div>
          <div class="input-wrap">
            <label for="location">Location</label>
            <input id="location" maxlength="120" placeholder="Add location (e.g. Riyadh, Saudi Arabia)">
          </div>
        </div>

        <div class="input-card">
          <div class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path>
            </svg>
          </div>
          <div class="input-wrap">
            <label for="mentions">Tag people</label>
            <input id="mentions" placeholder="Tag accounts separated by commas (e.g. lina, noah)">
          </div>
        </div>
      </div>

      <!-- Settings Cards -->
      <div class="settings-group">
        <h3 class="section-title">Post Settings</h3>

        <!-- Privacy / Audience -->
        <div class="setting-card">
          <div class="setting-icon audience-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </div>
          <div class="setting-info">
            <b>Who can see this post?</b>
            <small>Public (you can change privacy later)</small>
          </div>
          <div class="select-wrapper">
            <select id="privacy">
              <option value="public" selected>Public</option>
              <option value="followers">Followers</option>
              <option value="private">Only me</option>
            </select>
          </div>
        </div>

        <!-- Allow Comments -->
        <label class="setting-card clickable">
          <div class="setting-icon comments-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <div class="setting-info">
            <b>Allow comments</b>
            <small>Everyone can comment when enabled</small>
          </div>
          <div class="switch">
            <input id="comments" type="checkbox" checked>
            <span class="slider"></span>
          </div>
        </label>

        <!-- Share to Story -->
        <label class="setting-card clickable">
          <div class="setting-icon story-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="10 8 16 12 10 16 10 8"></polygon>
            </svg>
          </div>
          <div class="setting-info">
            <b>Also share to your story</b>
            <small>Visible on your profile story for 24 hours</small>
          </div>
          <div class="switch">
            <input id="toStory" type="checkbox">
            <span class="slider"></span>
          </div>
        </label>
      </div>

      <!-- Feedback message -->
      <p id="message" role="status" class="status-msg"></p>

      <!-- Bottom Wide Action Button -->
      <div class="bottom-action-wrap">
        <button id="bottomPublish" class="bottom-publish-btn" type="button">
          Publish Post
        </button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="theme.js"></script>
  <script src="create-post.js" defer></script>
</body>
</html>
