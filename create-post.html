<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080610"><title>ARS — Create Post</title><link rel="stylesheet" href="create-post.css"></head><body><main class="composer">
<header class="head"><a href="home.html" class="close">×</a><h1 id="pageTitle">Create Post</h1><button id="publish" class="publish">Publish</button></header>
<section class="identity"><div id="avatar" class="avatar">A</div><div><b id="displayName">Your ARS account</b><small id="handle">@you</small></div></section>
<textarea id="content" maxlength="5000" placeholder="What's happening?"></textarea><div class="counter"><span id="charCount">0</span>/280</div>
<div class="media-grid" id="mediaGrid"><label class="add-media">＋<b>Add photo or video</b><input id="media" type="file" accept="image/*,video/*" multiple></label></div>
<div class="format-tools"><button type="button" data-insert="bold">B</button><button type="button" data-insert="italic"><i>I</i></button><button type="button" data-insert="hashtag">#</button><button type="button" data-insert="location">⌖</button><button type="button" data-insert="mention">@</button><button type="button" id="editMedia">✧</button></div>
<label class="field">Location <input id="location" maxlength="120" placeholder="Add a location (optional)"></label>
<label class="field">Tag people <input id="mentions" placeholder="Usernames separated by commas"></label>
<div class="setting"><div><b>Who can see this post?</b><small>Choose your audience</small></div><select id="privacy"><option value="public">Public</option><option value="followers">Followers</option><option value="private">Only me</option></select></div>
<label class="setting"><span><b>Allow comments</b><small>Everyone can comment when enabled</small></span><input id="comments" type="checkbox" checked></label>
<label class="setting"><span><b>Also share to your story</b><small>Visible for 24 hours</small></span><input id="toStory" type="checkbox"></label>
<p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="create-post.js" defer></script></body></html>
