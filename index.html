<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08080B"
    >

    <title>ΛRS — Welcome</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(139, 61, 255, 0.18),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(197, 77, 255, 0.12),
                    transparent 30%
                ),
                #08080B;

            overflow-x: hidden;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 28px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 1080px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            min-height: 650px;

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 32px;

            overflow: hidden;

            background:
                rgba(18, 18, 23, 0.82);

            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);

            box-shadow:
                0 35px 100px rgba(0, 0, 0, 0.55);
        }

        /* ==============================
           LEFT SIDE
        ============================== */

        .brand-side {
            position: relative;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            padding: 55px;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(139, 61, 255, 0.30),
                    transparent 40%
                ),
                linear-gradient(
                    145deg,
                    #111116,
                    #0B0B10
                );
        }

        .brand-glow {
            position: absolute;

            width: 320px;
            height: 320px;

            border-radius: 50%;

            background:
                rgba(139, 61, 255, 0.16);

            filter: blur(90px);

            top: 20%;
            left: 30%;

            pointer-events: none;
        }

        .brand {
            position: relative;
            z-index: 2;

            font-size: 34px;
            font-weight: 900;

            letter-spacing: 3px;
        }

        .brand span {
            background:
                linear-gradient(
                    135deg,
                    #8B3DFF,
                    #C54DFF
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .brand-content {
            position: relative;
            z-index: 2;

            max-width: 440px;
        }

        .brand-content h1 {
            font-size: clamp(
                38px,
                4vw,
                62px
            );

            line-height: 1.02;

            font-weight: 900;

            margin-bottom: 22px;
        }

        .brand-content h1 span {
            color: #B978FF;
        }

        .brand-content p {
            color: #A2A2AD;

            font-size: 16px;

            line-height: 1.7;

            max-width: 390px;
        }

        .brand-footer {
            position: relative;
            z-index: 2;

            color: #666671;

            font-size: 13px;
        }

        /* ==============================
           RIGHT SIDE
        ============================== */

        .form-side {
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 45px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
        }

        .auth-heading {
            margin-bottom: 28px;
        }

        .auth-heading h2 {
            font-size: 30px;

            font-weight: 850;

            margin-bottom: 8px;
        }

        .auth-heading p {
            color: #8D8D98;

            font-size: 14px;

            line-height: 1.5;
        }

        /* ==============================
           TABS
        ============================== */

        .tabs {
            display: grid;

            grid-template-columns: 1fr 1fr;

            padding: 5px;

            margin-bottom: 25px;

            background:
                rgba(255, 255, 255, 0.045);

            border-radius: 14px;
        }

        .tab {
            min-height: 43px;

            border-radius: 10px;

            background: transparent;

            color: #777782;

            cursor: pointer;

            font-size: 14px;

            font-weight: 700;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .tab.active {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #8B3DFF,
                    #A946FF
                );

            box-shadow:
                0 8px 20px
                rgba(139, 61, 255, 0.22);
        }

        /* ==============================
           FORM
        ============================== */

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;

            color: #B7B7C0;

            font-size: 13px;

            font-weight: 650;

            margin-bottom: 8px;
        }

        .input {
            width: 100%;

            height: 52px;

            border-radius: 14px;

            border: 1px solid
                rgba(255, 255, 255, 0.08);

            outline: none;

            padding: 0 16px;

            color: #ffffff;

            background:
                rgba(255, 255, 255, 0.045);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .input::placeholder {
            color: #5E5E68;
        }

        .input:focus {
            border-color:
                rgba(139, 61, 255, 0.8);

            background:
                rgba(255, 255, 255, 0.06);

            box-shadow:
                0 0 0 4px
                rgba(139, 61, 255, 0.10);
        }

        /* ==============================
           PROFILE SETUP
        ============================== */

        .profile-setup {
            margin-top: 7px;
            margin-bottom: 18px;

            padding: 14px;

            border-radius: 18px;

            border: 1px solid
                rgba(255, 255, 255, 0.07);

            background:
                rgba(255, 255, 255, 0.035);
        }

        .profile-setup-button {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 13px;

            background: transparent;

            color: #ffffff;

            cursor: pointer;

            text-align: left;
        }

        .profile-preview {
            width: 48px;
            height: 48px;

            flex: 0 0 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #8B3DFF,
                    #C54DFF
                );

            font-size: 18px;

            font-weight: 900;

            box-shadow:
                0 8px 22px
                rgba(139, 61, 255, 0.22);
        }

        .profile-text {
            flex: 1;
        }

        .profile-text strong {
            display: block;

            font-size: 14px;

            margin-bottom: 3px;
        }

        .profile-text span {
            color: #777782;

            font-size: 12px;
        }

        .profile-arrow {
            color: #777782;

            font-size: 20px;
        }

        /* ==============================
           BUTTON
        ============================== */

        .primary-button {
            width: 100%;

            min-height: 54px;

            border-radius: 15px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #8B3DFF,
                    #C54DFF
                );

            cursor: pointer;

            font-size: 15px;

            font-weight: 800;

            box-shadow:
                0 14px 30px
                rgba(139, 61, 255, 0.22);

            transition:
                transform 0.15s ease,
                box-shadow 0.2s ease;
        }

        .primary-button:hover {
            box-shadow:
                0 17px 36px
                rgba(139, 61, 255, 0.32);
        }

        .primary-button:active {
            transform: scale(0.985);
        }

        /* ==============================
           DIVIDER
        ============================== */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 22px 0;
        }

        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            flex: 1;

            background:
                rgba(255, 255, 255, 0.07);
        }

        .divider span {
            color: #60606A;

            font-size: 12px;
        }

        /* ==============================
           SOCIAL
        ============================== */

        .social-buttons {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;
        }

        .social-button {
            min-height: 48px;

            border-radius: 13px;

            border: 1px solid
                rgba(255, 255, 255, 0.07);

            color: #D6D6DD;

            background:
                rgba(255, 255, 255, 0.035);

            cursor: pointer;

            font-size: 13px;

            font-weight: 700;
        }

        /* ==============================
           PROFILE MODAL
        ============================== */

        .modal {
            position: fixed;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.72);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            opacity: 0;
            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;

            z-index: 100;
        }

        .modal.open {
            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }

        .modal-card {
            width: 100%;
            max-width: 480px;

            max-height:
                calc(100vh - 40px);

            max-height:
                calc(100dvh - 40px);

            overflow-y: auto;

            padding: 25px;

            border-radius: 26px;

            border: 1px solid
                rgba(255, 255, 255, 0.09);

            background:
                #111116;

            box-shadow:
                0 30px 100px
                rgba(0, 0, 0, 0.65);

            transform:
                translateY(15px)
                scale(0.97);

            transition:
                transform 0.2s ease;
        }

        .modal.open .modal-card {
            transform:
                translateY(0)
                scale(1);
        }

        .modal-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 22px;
        }

        .modal-header h3 {
            font-size: 22px;

            font-weight: 850;
        }

        .close-button {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.06);

            color: #ffffff;

            cursor: pointer;

            font-size: 20px;
        }

        .setup-preview {
            display: flex;

            justify-content: center;

            margin-bottom: 25px;
        }

        .large-avatar {
            width: 96px;
            height: 96px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 34px;

            font-weight: 900;

            border: 4px solid
                #0A0A0D;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.45);
        }

        .setup-section {
            margin-bottom: 22px;
        }

        .setup-section-title {
            display: block;

            color: #B9B9C2;

            font-size: 13px;

            font-weight: 750;

            margin-bottom: 10px;
        }

        .letter-grid {
            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            gap: 7px;
        }

        .letter-option {
            aspect-ratio: 1;

            border-radius: 11px;

            color: #ffffff;

            background:
                rgba(255, 255, 255, 0.05);

            cursor: pointer;

            font-weight: 800;

            border: 1px solid
                transparent;
        }

        .letter-option.selected {
            border-color: #A855F7;

            box-shadow:
                0 0 0 2px
                rgba(168, 85, 247, 0.14);
        }

        .color-grid {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;
        }

        .color-option {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            cursor: pointer;

            border: 3px solid transparent;
        }

        .color-option.selected {
            border-color: #ffffff;

            box-shadow:
                0 0 0 2px #8B3DFF;
        }

        .subscribe-box {
            display: flex;

            align-items: center;

            gap: 12px;

            padding: 15px;

            margin-top: 5px;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    rgba(139, 61, 255, 0.13),
                    rgba(197, 77, 255, 0.06)
                );

            border: 1px solid
                rgba(168, 85, 247, 0.20);
        }

        .subscribe-info {
            flex: 1;
        }

        .subscribe-info strong {
            display: block;

            font-size: 13px;

            margin-bottom: 4px;
        }

        .subscribe-info span {
            color: #888894;

            font-size: 11px;

            line-height: 1.4;
        }

        .subscribe-button {
            min-height: 40px;

            padding: 0 15px;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #8B3DFF,
                    #C54DFF
                );

            color: #ffffff;

            cursor: pointer;

            font-size: 12px;

            font-weight: 800;
        }

        .save-profile {
            width: 100%;

            min-height: 50px;

            border-radius: 14px;

            margin-top: 5px;

            background:
                linear-gradient(
                    135deg,
                    #8B3DFF,
                    #C54DFF
                );

            color: #ffffff;

            cursor: pointer;

            font-weight: 800;
        }

        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 850px) {

            .page {
                padding: 18px;
            }

            .auth-wrapper {
                grid-template-columns: 1fr;

                max-width: 600px;

                min-height: auto;
            }

            .brand-side {
                min-height: 300px;

                padding: 35px;
            }

            .brand-content h1 {
                font-size: 42px;
            }

            .brand-content p {
                font-size: 14px;
            }

            .brand-footer {
                margin-top: 35px;
            }

            .form-side {
                padding: 35px;
            }

        }

        @media (max-width: 520px) {

            .page {
                padding: 0;
            }

            .auth-wrapper {
                min-height: 100vh;
                min-height: 100dvh;

                border-radius: 0;

                border-left: 0;
                border-right: 0;
            }

            .brand-side {
                min-height: 230px;

                padding: 28px 24px;
            }

            .brand {
                font-size: 27px;
            }

            .brand-content {
                margin-top: 25px;
            }

            .brand-content h1 {
                font-size: 34px;

                margin-bottom: 12px;
            }

            .brand-content p {
                font-size: 13px;
            }

            .form-side {
                padding: 28px 22px 40px;
            }

            .auth-heading h2 {
                font-size: 27px;
            }

            .social-buttons {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 0;
            }

            .modal-card {
                min-height: 100vh;
                min-height: 100dvh;

                max-height: none;

                border-radius: 0;

                padding:
                    24px
                    20px
                    30px;
            }

            .letter-grid {
                grid-template-columns:
                    repeat(6, 1fr);
            }

        }

        @media (max-width: 360px) {

            .form-side {
                padding-left: 17px;
                padding-right: 17px;
            }

            .letter-grid {
                grid-template-columns:
                    repeat(5, 1fr);
            }

        }
    </style>
</head>

<body>

    <main class="page">

        <section class="auth-wrapper">

            <!-- BRAND -->

            <aside class="brand-side">

                <div class="brand-glow"></div>

                <div class="brand">
                    <span>ΛRS</span>
                </div>

                <div class="brand-content">

                    <h1>
                        Your world.
                        <br>
                        <span>Your identity.</span>
                    </h1>

                    <p>
                        Connect, create and express yourself
                        in your own way.
                    </p>

                </div>
