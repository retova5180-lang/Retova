<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ARS — Notifications</title>
  <link rel="stylesheet" href="notifications.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="notifications-shell">
    <!-- Header -->
    <header class="notifications-header">
      <div class="header-left">
        <a href="home.html" class="brand-logo" aria-label="ARS Home">ARS</a>
        <h1 class="page-title">Notifications</h1>
      </div>
      <button type="button" id="markAllReadBtn" class="mark-all-btn" title="Mark all as read">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Mark all read</span>
      </button>
    </header>

    <!-- Filter Tabs -->
    <nav class="filter-tabs" aria-label="Notification Categories">
      <button type="button" class="tab-pill active" data-filter="all">All</button>
      <button type="button" class="tab-pill" data-filter="interactions">Interactions</button>
      <button type="button" class="tab-pill" data-filter="follows">Follows</button>
      <button type="button" class="tab-pill" data-filter="system">System</button>
    </nav>

    <!-- Notifications List -->
    <main class="notifications-main">
      <div id="notificationsList" class="notifications-list">
        <div class="loading-state">
          <div class="ars-spinner"></div>
          <p>Loading your notifications…</p>
        </div>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
        <h2>All Caught Up</h2>
        <p>When people like your posts, comment, follow you, or send streak requests, you’ll see them right here.</p>
        <a href="home.html" class="explore-link-btn">Go to Feed</a>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Primary Navigation">
      <a href="home.html" class="nav-item" aria-label="Home">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home</span>
      </a>
      <a href="search.html" class="nav-item" aria-label="Explore">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Explore</span>
      </a>
      <a href="create-post.html" class="nav-create" aria-label="Create Post">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </a>
      <a href="notifications.html" class="nav-item active" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span>Alerts</span>
      </a>
      <a href="profile.html" class="nav-item" aria-label="Profile">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="theme.js"></script>
  <script src="notifications.js" defer></script>
</body>
</html>
