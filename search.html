<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08070d">
  <title>ΛRS — Search</title>
  <link rel="stylesheet" href="search.css?v=ars-rebuild-20261022-r3">
</head>
<body>
  <header class="search-header">
    <a class="brand" href="home.html" aria-label="ARS Home">Λ<span>RS</span></a>
    <label class="search-field">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="Search ARS" autocomplete="off">
      <button id="clearSearch" type="button" aria-label="Clear search" hidden>×</button>
    </label>
  </header>

  <main class="explore-layout">
    <section class="section recent-section">
      <div class="section-heading">
        <h1>Recent Searches</h1>
        <button id="clearAll" class="text-action" type="button">Clear All</button>
      </div>
      <div id="recentSearches" class="recent-list">
        <p class="empty-copy">Your recent searches will appear here.</p>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>Trending Now</h2>
        <span class="section-mark">✦</span>
      </div>
      <div id="trendingList" class="trending-list">
        <button class="trend-row" type="button" data-query="For You"><span class="trend-thumb thumb-one">✦</span><span class="trend-copy"><strong>For You</strong><small>Discover what people are sharing</small></span><span class="trend-arrow">↗</span></button>
        <button class="trend-row" type="button" data-query="Photography"><span class="trend-thumb thumb-two">◉</span><span class="trend-copy"><strong>Photography</strong><small>Creative moments from the community</small></span><span class="trend-arrow">↗</span></button>
        <button class="trend-row" type="button" data-query="Daily Life"><span class="trend-thumb thumb-three">☼</span><span class="trend-copy"><strong>Daily Life</strong><small>Little moments worth sharing</small></span><span class="trend-arrow">↗</span></button>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>Popular Content</h2>
        <button id="refreshContent" class="text-action" type="button">Refresh</button>
      </div>
      <div id="popularContent" class="popular-grid">
        <div class="content-placeholder"><span>✦</span><strong>Discover</strong><small>Popular posts from ARS</small></div>
        <div class="content-placeholder content-placeholder-alt"><span>◉</span><strong>Explore</strong><small>Find your next inspiration</small></div>
      </div>
    </section>

    <section class="section suggestions-section">
      <div class="section-heading">
        <h2>Suggested Accounts</h2>
        <span class="muted">People to know</span>
      </div>
      <div id="suggestedAccounts" class="account-list">
        <p class="empty-copy">Sign in to discover accounts.</p>
      </div>
    </section>

    <section class="section results-section" id="resultsSection" hidden>
      <div class="section-heading"><h2>Search Results</h2><span id="resultCount" class="muted"></span></div>
      <div id="searchResults" class="result-list"></div>
    </section>
  </main>

    <nav class="bottom-nav" aria-label="Main navigation">
    <a class="bottom-item" href="home.html"><span aria-hidden="true">⌂</span><small>Home</small></a>
    <a class="bottom-item" href="streak.html"><span aria-hidden="true">♨</span><small>Streak</small></a>
    <a class="bottom-item active" href="search.html" aria-current="page"><span aria-hidden="true">⌕</span><small>Search</small></a>
    <a class="bottom-item" href="home.html#profile"><span aria-hidden="true">◎</span><small>Profile</small></a>
    <a class="bottom-item" href="notifications.html"><span aria-hidden="true">♧</span><small>Notifications</small></a>
  </nav>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="search.js?v=ars-rebuild-20261022-r3" defer></script>
</body>
</html>
