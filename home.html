<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARS</title>
<link rel="stylesheet" href="home.css">

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="app">

<header class="topbar">
  <button id="profileButton" class="avatar top-avatar" aria-label="Profile"></button>

  <div class="brand">ΛRS</div>

  <button id="wheelButton" class="wheel-button" aria-label="Wheel">
    <i data-lucide="orbit"></i>
  </button>
</header>

<main>

<section id="homePage" class="page active">

  <div id="stories" class="stories"></div>

  <div id="feed" class="feed"></div>

</section>

<section id="searchPage" class="page">

  <div class="page-head">
    <h1>Search</h1>
  </div>

  <div class="search-box">
    <i data-lucide="search"></i>
    <input id="searchInput" placeholder="Search ARS">
  </div>

  <div id="searchHome" class="search-home">
    <i data-lucide="search"></i>
    <h2>Search ARS</h2>
    <p>Find people, posts and hashtags.</p>
  </div>

  <div id="searchResults"></div>

</section>

<section id="trendingPage" class="page">

  <div class="page-head">
    <h1>Trending</h1>
    <i data-lucide="flame"></i>
  </div>

  <div id="trendingList"></div>

</section>

<section id="streakPage" class="page">

  <div class="streak-card">

    <div class="streak-fire">
      <i data-lucide="flame"></i>
    </div>

    <strong id="streakNumber">0</strong>

    <span id="streakText">day streak</span>

    <div id="weekDots" class="week-dots"></div>

    <p id="streakDone"></p>

  </div>

</section>

<section id="notificationsPage" class="page">

  <div class="page-head">
    <h1>Notifications</h1>
  </div>

  <div class="empty-state">
    <i data-lucide="bell"></i>
    <h2>You're all caught up</h2>
    <p>New activity will appear here.</p>
  </div>

</section>

<section id="messagesPage" class="page">

  <div class="page-head">
    <h1>Messages</h1>
  </div>

  <div class="empty-state">
    <i data-lucide="mail"></i>
    <h2>No messages yet</h2>
    <p>Your conversations will appear here.</p>
  </div>

</section>

<section id="profilePage" class="page">

  <div id="profileHero"></div>

  <div id="profilePostsList" class="feed"></div>

</section>

<section id="wheelPage" class="page">

  <div class="wheel-card">

    <div id="wheel" class="wheel">
      <i data-lucide="orbit"></i>
    </div>

    <div id="spinCounter">0 spins</div>

    <div id="planLabel">Free</div>

    <button id="spinButton" class="primary-button">
      Spin
    </button>

    <p id="challengeResult"></p>

    <button id="openStreakFromWheel" class="secondary-button">
      Open Streak
    </button>

  </div>

</section>

</main>

<button id="createPost" class="fab" aria-label="Create post">
  <i data-lucide="plus"></i>
</button>

<nav class="bottom-nav">

  <button class="nav-item active" data-page="homePage">
    <i data-lucide="house"></i>
    <span>Home</span>
  </button>

  <button class="nav-item" data-page="searchPage">
    <i data-lucide="search"></i>
    <span>Search</span>
  </button>

  <button class="nav-item" data-page="trendingPage">
    <i data-lucide="flame"></i>
    <span>Trending</span>
  </button>

  <button class="nav-item" data-page="notificationsPage">
    <i data-lucide="bell"></i>
    <b class="nav-dot"></b>
    <span>Notifications</span>
  </button>

  <button class="nav-item" data-page="messagesPage">
    <i data-lucide="mail"></i>
    <span>Messages</span>
  </button>

</nav>

<div id="createPostModal" class="overlay">

  <div class="compose-sheet">

    <div class="sheet-handle"></div>

    <div class="compose-head">

      <button id="createPostClose" class="icon-button">
        <i data-lucide="x"></i>
      </button>

      <strong>Post</strong>

      <button id="publishPost" class="primary-button small">
        Post
      </button>

    </div>

    <div class="compose-body">

      <div id="composeAvatar" class="avatar"></div>

      <div class="compose-main">

        <textarea
          id="createPostText"
          maxlength="1000"
          placeholder="What's happening?"
        ></textarea>

        <div id="postImagePreview" class="media-preview"></div>

        <input
          id="createPostImage"
          type="file"
          accept="image/*"
          hidden
        >

        <div class="compose-tools">

          <button
            type="button"
            id="pickPostImage"
            class="tool"
          >
            <i data-lucide="image"></i>
          </button>

          <button type="button" class="tool">
            <i data-lucide="file-image"></i>
            <span>GIF</span>
          </button>

          <button type="button" class="tool">
            <i data-lucide="smile"></i>
          </button>

          <button type="button" class="tool">
            <i data-lucide="map-pin"></i>
          </button>

        </div>

      </div>

    </div>

  </div>

</div>

<div id="createStoryModal" class="overlay">

  <div class="story-editor">

    <div class="compose-head">

      <button id="createStoryClose" class="icon-button">
        <i data-lucide="x"></i>
      </button>

      <strong>New Story</strong>

      <button id="publishStory" class="primary-button small">
        Share
      </button>

    </div>

    <div id="storyCanvas" class="story-canvas">

      <div id="storyCanvasEmpty">
        <i data-lucide="image-plus"></i>
        <span>Choose a photo</span>
      </div>

      <img id="storyImagePreview" alt="">

      <div id="storyTextPreview"></div>

    </div>

    <input
      id="storyImage"
      type="file"
      accept="image/*"
      hidden
    >

    <div class="story-controls">

      <button
        id="pickStoryImage"
        class="secondary-button"
      >
        <i data-lucide="image"></i>
        Photo
      </button>

      <input
        id="storyText"
        maxlength="120"
        placeholder="Add text to your story"
      >

      <select id="storyPosition">
        <option value="top">Top</option>
        <option value="center" selected>Center</option>
        <option value="bottom">Bottom</option>
      </select>

      <input
        id="storyTextColor"
        type="color"
        value="#ffffff"
      >

    </div>

  </div>

</div>

<div id="storyViewer" class="overlay">

  <div class="story-viewer">

    <button id="storyViewerClose" class="viewer-close">
      <i data-lucide="x"></i>
    </button>

    <div id="storyViewerMedia"></div>

    <div id="storyViewerText"></div>

    <div id="storyViewerUser"></div>

  </div>

</div>

<div id="commentsModal" class="overlay">

  <div class="modal-card">

    <div class="compose-head">

      <strong>Comments</strong>

      <button id="commentsClose" class="icon-button">
        <i data-lucide="x"></i>
      </button>

    </div>

    <div id="commentsList"></div>

    <div class="comment-compose">

      <input
        id="commentInput"
        placeholder="Write a comment"
      >

      <button
        id="sendComment"
        class="primary-button small"
      >
        Send
      </button>

    </div>

  </div>

</div>

<div id="postMenuBackdrop" class="overlay"></div>

<div id="toast" class="toast"></div>

<script src="home.js"></script>

</body>
        </html>
