<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#050507">
  <title>ΛRS</title>

  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="create-post.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div class="app-shell">

    <header class="topbar">
      <button
        id="myAvatar"
        class="top-avatar"
        type="button"
        aria-label="Profile"
      >
        R
      </button>

      <div class="brand" aria-label="ΛRS">
        ΛRS
      </div>

      <button
        id="headerWheel"
        class="header-wheel"
        type="button"
        aria-label="Open Wheel"
      >
        <span class="wheel-mini">
          <span></span>
        </span>
      </button>
    </header>

    <section
      class="stories-section"
      aria-label="Stories"
    >
      <div
        class="stories-row"
        id="stories"
      ></div>
    </section>

    <main
      id="feed"
      class="feed"
      aria-label="Posts"
    ></main>

    <button
      id="newPost"
      class="new-post-button"
      type="button"
      aria-label="Create post"
    >
      <i data-lucide="plus"></i>
    </button>

    <nav
      class="bottom-nav"
      aria-label="Main navigation"
    >
      <button
        class="nav-button active"
        type="button"
        data-page="home"
      >
        <i data-lucide="house"></i>
        <span>Home</span>
      </button>

      <button
        class="nav-button"
        type="button"
        data-page="search"
      >
        <i data-lucide="search"></i>
        <span>Search</span>
      </button>

      <button
        class="nav-button"
        type="button"
        data-page="trending"
      >
        <i data-lucide="flame"></i>
        <span>Trending</span>
      </button>

      <button
        class="nav-button"
        type="button"
        data-page="notifications"
      >
        <i data-lucide="bell"></i>
        <span>Notifications</span>
        <b class="nav-dot"></b>
      </button>

      <button
        class="nav-button"
        type="button"
        data-page="messages"
      >
        <i data-lucide="mail"></i>
        <span>Messages</span>
      </button>
    </nav>
  </div>

  <div
    id="storyViewer"
    class="overlay hidden"
    aria-hidden="true"
  >
    <div
      class="overlay-backdrop"
      data-close-story
    ></div>

    <div
      class="story-viewer-card"
      role="dialog"
      aria-modal="true"
      aria-label="Story"
    >
      <button
        id="closeStory"
        class="overlay-close"
        type="button"
        aria-label="Close"
      >
        <i data-lucide="x"></i>
      </button>

      <div class="story-progress">
        <span></span>
      </div>

      <div
        id="storyViewerAvatar"
        class="viewer-avatar"
      >
        L
      </div>

      <div
        id="storyViewerName"
        class="viewer-name"
      >
        Lina
      </div>

      <div
        id="storyViewerImage"
        class="viewer-image"
      ></div>

      <video
        id="storyViewerVideo"
        class="viewer-video hidden"
        controls
        playsinline
      ></video>

      <div
        id="storyViewerText"
        class="viewer-text"
      ></div>
    </div>
  </div>

  <div
    id="postDetail"
    class="overlay hidden"
    aria-hidden="true"
  >
    <div
      class="overlay-backdrop"
      data-close-post-detail
    ></div>

    <article
      class="post-detail-card"
      role="dialog"
      aria-modal="true"
      aria-label="Post and replies"
    >
      <header class="detail-header">
        <button
          id="closePostDetail"
          class="overlay-close inline"
          type="button"
          aria-label="Close"
        >
          <i data-lucide="x"></i>
        </button>

        <h3>Post</h3>

        <span></span>
      </header>

      <div
        id="detailPostBody"
        class="detail-post-body"
      ></div>

      <div class="replies-title">
        <span>Replies</span>
        <b id="replyCount">0</b>
      </div>

      <div
        id="detailReplies"
        class="detail-replies"
      ></div>

      <form
        id="replyForm"
        class="reply-form"
      >
        <div
          id="replyAvatar"
          class="reply-avatar"
        >
          R
        </div>

        <input
          id="replyInput"
          maxlength="280"
          autocomplete="off"
          placeholder="Write a reply..."
        >

        <button type="submit">
          Send
        </button>
      </form>
    </article>
  </div>

  <script src="wheel.js"></script>
  <script src="create-post.js"></script>
  <script src="home.js"></script>
  <script src="stories-posts.js"></script>

  <script>
    if (
      window.lucide &&
      typeof window.lucide.createIcons === "function"
    ) {
      window.lucide.createIcons();
    }
  </script>
</body>
         </html>
