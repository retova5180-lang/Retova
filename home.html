<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ΛRS — Home</title>

  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="create-post.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <main class="phone">

    <!-- ================= HEADER ================= -->
    <header class="header">

      <div class="header-left">
        <div id="myAvatar" class="header-avatar ars-avatar">
          A
        </div>
      </div>

      <div class="logo">
        ΛRS
      </div>

      <button
        id="settings"
        class="icon-button"
        type="button"
        aria-label="Settings"
      >
        <i data-lucide="settings"></i>
      </button>

    </header>


    <!-- ================= STORIES ================= -->
    <section class="stories-section">

      <div
        id="stories"
        class="stories"
        aria-label="Stories"
      ></div>

    </section>


    <!-- ================= FEED ================= -->
    <section
      id="feed"
      class="feed"
    ></section>


    <!-- ================= CREATE POST BUTTON ================= -->
    <button
      id="newPost"
      class="new-post-button"
      type="button"
      aria-label="Create post"
    >
      <i data-lucide="plus"></i>
    </button>


    <!-- ================= BOTTOM NAV ================= -->
    <nav class="bottom-nav">

      <button
        class="nav-item active"
        data-nav="home"
        type="button"
        aria-label="Home"
      >
        <i data-lucide="house"></i>
        <span>Home</span>
      </button>

      <button
        class="nav-item"
        data-nav="search"
        type="button"
        aria-label="Search"
      >
        <i data-lucide="search"></i>
        <span>Search</span>
      </button>

      <button
        class="nav-item"
        data-nav="wheel"
        type="button"
        aria-label="Wheel"
      >
        <i data-lucide="flame"></i>
        <span>Wheel</span>
      </button>

      <button
        class="nav-item"
        data-nav="notifications"
        type="button"
        aria-label="Notifications"
      >
        <i data-lucide="bell"></i>
        <span>Alerts</span>
      </button>

      <button
        class="nav-item"
        data-nav="messages"
        type="button"
        aria-label="Messages"
      >
        <i data-lucide="mail"></i>
        <span>Messages</span>
      </button>

    </nav>


    <!-- ================= COMMENTS SHEET ================= -->
    <div
      id="commentsSheet"
      class="comments-sheet"
      aria-hidden="true"
    >

      <div class="comments-overlay"></div>

      <div class="comments-panel">

        <div class="comments-header">

          <div>
            <h3>Comments</h3>
            <span id="commentsCount">0 comments</span>
          </div>

          <button
            id="closeComments"
            class="icon-button"
            type="button"
            aria-label="Close comments"
          >
            <i data-lucide="x"></i>
          </button>

        </div>


        <div
          id="commentsList"
          class="comments-list"
        ></div>


        <form
          id="commentForm"
          class="comment-form"
        >

          <input
            id="commentInput"
            type="text"
            placeholder="Write a comment..."
            autocomplete="off"
            maxlength="500"
          >

          <button
            type="submit"
            aria-label="Send comment"
          >
            <i data-lucide="send"></i>
          </button>

        </form>

      </div>

    </div>


    <!-- ================= REACTION PICKER ================= -->
    <div
      id="reactionPicker"
      class="reaction-picker"
      aria-hidden="true"
    >

      <button
        type="button"
        data-reaction="❤️"
      >
        ❤️
      </button>

      <button
        type="button"
        data-reaction="🔥"
      >
        🔥
      </button>

      <button
        type="button"
        data-reaction="😂"
      >
        😂
      </button>

      <button
        type="button"
        data-reaction="😍"
      >
        😍
      </button>

      <button
        type="button"
        data-reaction="😮"
      >
        😮
      </button>

      <button
        type="button"
        data-reaction="👏"
      >
        👏
      </button>

    </div>

  </main>


  <!-- ================= SCRIPTS ================= -->

  <script
    src="home.js"
    defer
  ></script>

  <script
    src="create-post.js"
    defer
  ></script>

</body>
</html>
