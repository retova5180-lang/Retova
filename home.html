<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ΛRS</title>

    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="create-post.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <button
            class="avatar-button"
            id="myAvatar"
            type="button"
            aria-label="Profile"
        >
            R
        </button>

        <div class="logo">ΛRS</div>

        <button
            class="icon-button"
            id="settings"
            type="button"
            aria-label="Settings"
        >
            <i data-lucide="settings-2"></i>
        </button>

    </header>


    <!-- STORIES -->
    <section class="stories-section">

        <div class="stories-header">

            <h2>Stories</h2>

            <button
                id="viewAllStories"
                type="button"
            >
                View all
            </button>

        </div>

        <div
            id="stories"
            class="stories"
        ></div>

    </section>


    <!-- FEED -->
    <main
        id="feed"
        class="feed"
    ></main>


    <!-- CREATE POST -->
    <button
        id="newPost"
        class="new-post-button"
        type="button"
        aria-label="Create post"
    >
        <i data-lucide="plus"></i>
    </button>


    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

        <button
            class="nav-button active"
            type="button"
            aria-label="Home"
            data-page="home"
        >
            <i data-lucide="house"></i>
            <span>Home</span>
        </button>

        <button
            class="nav-button"
            type="button"
            aria-label="Search"
            data-page="search"
        >
            <i data-lucide="search"></i>
            <span>Search</span>
        </button>

        <button
            class="nav-button"
            type="button"
            aria-label="Explore"
            data-page="explore"
        >
            <i data-lucide="flame"></i>
            <span>Explore</span>
        </button>

        <button
            class="nav-button"
            type="button"
            aria-label="Notifications"
            data-page="notifications"
        >
            <i data-lucide="bell"></i>
            <span>Alerts</span>
        </button>

        <button
            class="nav-button"
            type="button"
            aria-label="Messages"
            data-page="messages"
        >
            <i data-lucide="mail"></i>
            <span>Messages</span>
        </button>

    </nav>

</div>


<!-- COMMENTS -->
<div
    id="commentsSheet"
    class="comments-sheet"
>

    <div class="comments-overlay"></div>

    <div class="comments-panel">

        <div class="comments-header">

            <div class="comments-line"></div>

            <div class="comments-title-row">

                <h3>Comments</h3>

                <button
                    id="closeComments"
                    type="button"
                >
                    ×
                </button>

            </div>

        </div>

        <div
            id="commentsList"
            class="comments-list"
        ></div>

        <div class="comments-input">

            <div
                class="my-comment-avatar"
                id="myCommentAvatar"
            >
                R
            </div>

            <input
                id="commentInput"
                type="text"
                maxlength="280"
                placeholder="Write a comment..."
            >

            <button
                id="sendComment"
                type="button"
            >
                Send
            </button>

        </div>

    </div>

</div>


<!-- STORY VIEWER -->
<div
    id="storyViewer"
    class="story-viewer"
>

    <div class="story-viewer-background"></div>

    <div class="story-viewer-content">

        <button
            id="closeStory"
            class="story-close"
            type="button"
        >
            ×
        </button>

        <div
            id="storyViewerAvatar"
            class="story-viewer-avatar"
        >
            L
        </div>

        <div
            id="storyViewerName"
            class="story-viewer-name"
        >
            Lina
        </div>

        <div
            id="storyViewerImage"
            class="story-viewer-image"
        ></div>

        <div
            id="storyViewerText"
            class="story-viewer-text"
        ></div>

    </div>

</div>


<script src="home.js"></script>
<script src="create-post.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (window.lucide) {
            lucide.createIcons();
        }
    });
</script>

</body>
</html>
