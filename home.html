<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>ΛRS</title>

<link rel="stylesheet" href="home.css">

<link rel="stylesheet" href="create-post.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.googleapis.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>


<div class="phone">


<!-- =========================================
HEADER
========================================= -->

<header class="header">


<div id="myAvatar"></div>


<div class="logo">

ΛRS

</div>
<button
    id="wheelButton"
    type="button"
    aria-label="Wheel"
>

    <i data-lucide="disc-3"></i>

</button>



<!-- =========================================
STORIES
========================================= -->

<section id="stories">

</section>



<!-- =========================================
FEED
========================================= -->

<main id="feed">

</main>



<!-- =========================================
CREATE POST BUTTON
========================================= -->

<button
id="newPost"
type="button"
aria-label="Create post"
>

<i data-lucide="plus"></i>

</button>



<!-- =========================================
BOTTOM NAVIGATION
========================================= -->

<nav>


<button
class="active"
type="button"
aria-label="Home"
>

<i data-lucide="house"></i>

</button>


<button
type="button"
aria-label="Search"
>

<i data-lucide="search"></i>

</button>


<button
type="button"
aria-label="Explore"
>

<i data-lucide="flame"></i>

</button>


<button
type="button"
aria-label="Notifications"
>

<i data-lucide="bell"></i>

</button>


<button
type="button"
aria-label="Messages"
>

<i data-lucide="mail"></i>

</button>


</nav>


</div>



<!-- =========================================
COMMENTS SHEET
========================================= -->

<div
id="commentsSheet"
class="comments-sheet"
>


<div class="comments-header">


<div class="comments-line"></div>


<h3>

Comments

</h3>


</div>



<div id="commentsList">

</div>



<div class="comments-input">


<div class="my-comment-avatar">

R

</div>



<input
type="text"
placeholder="Write a comment..."
>



<button
type="button"
>

Send

</button>


</div>


</div>
