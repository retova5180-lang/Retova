<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05040b">
  <title>ARS — Story Editor</title>
  <link rel="stylesheet" href="story-editor.css">
</head>
<body>
  <header class="brandbar"><a href="home.html">ARS</a></header>
  <main class="editor">
    <section class="stage">
      <button class="close" id="closeEditor" aria-label="Close">×</button>
      <button class="undo-btn hidden" id="undoBtn" aria-label="Undo" title="Undo">↶</button>
      <button class="change-btn hidden" id="changeMediaBtn" aria-label="Change Media" title="Change photo or video">⟳ Change</button>

      <div class="preview-wrap" id="previewWrap">
        <div id="emptyPreview" class="empty-preview">
          <div class="empty-icon">＋</div>
          <b>Choose photo or video</b>
          <small>Tap, click, or drop media here to start your story</small>
          <button type="button" id="browseMediaBtn" class="browse-btn">Browse Files</button>
        </div>
        <img id="storyImage" class="story-image hidden" alt="Story preview">
        <video id="storyVideo" class="story-image hidden" controls playsinline></video>
        <canvas id="drawCanvas"></canvas>
        <div id="textLayer" class="overlay-layer"></div>
        <span class="zoom-label" id="zoomLabel">1.0x</span>
      </div>

      <aside class="tools">
        <button data-tool="filters" class="active" title="Filters"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></i><span>Filters</span></button>
        <button data-tool="text" title="Add Text"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="9" y1="20" x2="15" y2="20"/></svg></i><span>Text</span></button>
        <button data-tool="stickers" title="Stickers"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10l-10 10A10 10 0 0 1 2 12 10 10 0 0 1 12 2z"/></svg></i><span>Stickers</span></button>
        <button data-tool="emoji" title="Emoji"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></i><span>Emoji</span></button>
        <button data-tool="draw" title="Draw"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18.375 2.625a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.375-9.375z"/></svg></i><span>Draw</span></button>
        <button data-tool="crop" title="Crop &amp; Rotate"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"/><path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"/></svg></i><span>Crop &amp; Rotate</span></button>
        <button data-tool="sound" title="Soundtrack"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.08"/></svg></i><span>Sound</span></button>
        <button data-tool="erase" title="Eraser"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L14 19"/><line x1="18" y1="12" x2="11" y2="19"/></svg></i><span>Erase</span></button>
      </aside>
    </section>

    <section class="controls">
      <input id="storyFile" type="file" accept="image/*,video/*" hidden>
      <input id="soundPicker" type="file" accept="audio/*" hidden>

      <div class="tool-panel" id="toolPanel">
        <!-- Filter list (default) -->
        <div class="filter-list" id="filterList">
          <button data-filter="none" class="active">None</button>
          <button data-filter="vivid">Vivid</button>
          <button data-filter="moody">Moody</button>
          <button data-filter="dreamy">Dreamy</button>
          <button data-filter="bw">B&amp;W</button>
          <button data-filter="neon">Neon</button>
        </div>

        <!-- Sticker list panel -->
        <div class="sticker-list hidden" id="stickerList">
          <button type="button" data-sticker="✨">✨</button>
          <button type="button" data-sticker="❤️">❤️</button>
          <button type="button" data-sticker="🔥">🔥</button>
          <button type="button" data-sticker="🌙">🌙</button>
          <button type="button" data-sticker="⭐">⭐</button>
          <button type="button" data-sticker="🚀">🚀</button>
          <button type="button" data-sticker="👑">👑</button>
          <button type="button" data-sticker="⚡">⚡</button>
          <button type="button" data-sticker="💯">💯</button>
          <button type="button" data-sticker="💜">💜</button>
        </div>

        <!-- Emoji list panel -->
        <div class="emoji-list hidden" id="emojiList">
          <button type="button" data-emoji="😂">😂</button>
          <button type="button" data-emoji="💜">💜</button>
          <button type="button" data-emoji="😍">😍</button>
          <button type="button" data-emoji="🔥">🔥</button>
          <button type="button" data-emoji="👏">👏</button>
          <button type="button" data-emoji="🎉">🎉</button>
          <button type="button" data-emoji="🥳">🥳</button>
          <button type="button" data-emoji="😎">😎</button>
          <button type="button" data-emoji="🤩">🤩</button>
          <button type="button" data-emoji="👻">👻</button>
        </div>

        <!-- Draw options panel -->
        <div class="draw-options hidden" id="drawOptions">
          <button type="button" class="color-btn active" data-color="#b45cff" style="--c:#b45cff" aria-label="Purple"></button>
          <button type="button" class="color-btn" data-color="#ffffff" style="--c:#ffffff" aria-label="White"></button>
          <button type="button" class="color-btn" data-color="#ff3366" style="--c:#ff3366" aria-label="Pink"></button>
          <button type="button" class="color-btn" data-color="#ffcc00" style="--c:#ffcc00" aria-label="Yellow"></button>
          <button type="button" class="color-btn" data-color="#00f2fe" style="--c:#00f2fe" aria-label="Cyan"></button>
          <button type="button" class="color-btn" data-color="#43e97b" style="--c:#43e97b" aria-label="Green"></button>
          <span class="brush-label" id="brushLabel">Brush: 5px</span>
        </div>

        <!-- Crop & Rotate panel -->
        <div class="crop-options hidden" id="cropOptions">
          <button type="button" id="rotateBtn" class="panel-action">⟳ Rotate 90°</button>
          <button type="button" id="zoomInBtn" class="panel-action">＋ Zoom In</button>
          <button type="button" id="zoomOutBtn" class="panel-action">－ Zoom Out</button>
          <button type="button" id="resetTransformBtn" class="panel-action">↺ Reset</button>
        </div>
      </div>

      <div class="timeline">
        <button id="playPreview" aria-label="Play preview">▷</button>
        <div class="track"><span id="trackProgress"></span></div>
        <button id="soundToggle" aria-label="Toggle sound">◖))</button>
      </div>

      <div class="bottom-actions">
        <button id="saveDraft" class="outline">⇩ Save Draft</button>
        <button id="nextStory" class="primary">Next ›</button>
      </div>
      <p id="editorMessage" role="status"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="theme.js"></script>
  <script src="story-editor.js" defer></script>
</body>
</html>
